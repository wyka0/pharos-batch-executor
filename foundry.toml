[profile.default]
src = "contracts"
test = "contracts/test"
script = "contracts/script"
out = "out"
cache_path = "cache"
libs = []
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200

# Explicitly local-only. Do not add Atlantic or mainnet RPC endpoints here.
[rpc_endpoints]
local = "http://127.0.0.1:8545"
