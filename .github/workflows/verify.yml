name: Verify Batch Executor
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.2.3
      - run: npm ci
      - name: Prepare pinned Solidity 0.8.24 compiler
        shell: bash
        run: |
          set -euo pipefail
          if ! forge build --use 0.8.24 --force; then
            echo "::error::Failed to download or compile with pinned Solidity 0.8.24."
            exit 1
          fi
          if ! forge build --offline --use 0.8.24 --force; then
            echo "::error::Pinned Solidity 0.8.24 was not available from the Foundry cache after preparation."
            exit 1
          fi
      - run: npm run verify
      - run: npm run demo:local
      - run: npm audit --audit-level=low
      - run: node dist/cli.js --help
      - name: Preserve local proof even if assertions fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-evm-evidence
          path: evidence/runs/
          if-no-files-found: ignore
          retention-days: 14
